<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>T.K Group – لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light dark;--bg:#f2f5fa;--card:#fff;--tx:#0b1b3a;--mut:#5a6a8a;--bd:#e0e7f2;--brand:#0a2f6b;--yel:#ffd400;--navy:#02183c;--ok:#16a06a;--err:#d1432f;--shadow:0 6px 22px rgba(8,30,70,.10);--pat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2756%27 viewBox=%270 0 56 56%27%3E%3Cg fill=%27none%27 stroke=%27%23e8d9a8%27 stroke-opacity=%27.17%27 stroke-width=%271%27%3E%3Cpath d=%27M28 5l6.5 16.5L51 28l-16.5 6.5L28 51l-6.5-16.5L5 28l16.5-6.5z%27/%3E%3Ccircle cx=%2728%27 cy=%2728%27 r=%279%27/%3E%3Cpath d=%27M0 0l9 9M56 0l-9 9M0 56l9-9M56 56l-9-9%27/%3E%3C/g%3E%3C/svg%3E");--s0:#b45f06;--s3:#1d62c9;--s4:#7a3fc4;--s5:#0b8a86;--s6:#16804f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142e;--card:#0e2247;--tx:#eef2fb;--mut:#a9bbdd;--bd:#2b4a86;--brand:#8db4f5;--shadow:none;--s0:#f0a04b;--s3:#7fb0ff;--s4:#c39bff;--s5:#4fd1c5;--s6:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Cairo,Tajawal,system-ui,Arial,sans-serif;padding-bottom:84px}
header{background:var(--pat),linear-gradient(160deg,#0a3a7d,#02183c);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:5;border-radius:0 0 22px 22px;box-shadow:0 4px 18px rgba(2,24,60,.35)}
header img{width:62px;height:56px;border-radius:12px;object-fit:cover;border:1.5px solid rgba(232,217,168,.5);flex:none}
header .hb{flex:1;min-width:0}header b{display:block;font-size:17px;font-weight:800;line-height:1.25}header .hs{display:block;color:#c9d6f0;font-size:12px}
header small{color:#ffe27a;font-size:12px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:760px;margin:auto;padding:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}.box h2{margin:0 0 10px;font-size:17px;font-weight:800}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select{width:100%;font:inherit;padding:12px;border-radius:13px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:4px}
input:focus,select:focus{outline:2px solid var(--yel);border-color:var(--yel)}
.btn{display:block;width:100%;background:var(--yel);color:#07204a;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:800;cursor:pointer;margin-top:10px;text-align:center;box-shadow:0 4px 14px rgba(255,212,0,.25)}
.btn.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}.btn.ok{background:var(--ok);color:#fff;box-shadow:none}.btn.s{display:inline-block;width:auto;padding:8px 13px;margin:3px 2px;font-size:13px;border-radius:12px}.btn[disabled]{opacity:.45}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.msg{padding:11px 13px;border-radius:13px;margin-top:10px;font-size:14px}
.msg.e{background:rgba(209,67,47,.14);color:var(--err)}.msg.o{background:rgba(22,160,106,.14);color:var(--ok)}.msg.i{background:rgba(29,98,201,.14);color:var(--tx)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd);color:var(--tx);margin-inline-start:6px}
.tag.s0{background:rgba(240,160,75,.18);color:var(--s0)}.tag.s1,.tag.s2{background:rgba(255,212,0,.18);color:var(--s0)}.tag.s3{background:rgba(29,98,201,.16);color:var(--s3)}.tag.s4{background:rgba(122,63,196,.16);color:var(--s4)}.tag.s5{background:rgba(11,138,134,.16);color:var(--s5)}.tag.s6{background:rgba(22,160,106,.18);color:var(--s6)}.tag.w{background:rgba(255,212,0,.22);color:var(--s0)}.tag.p{background:rgba(22,160,106,.18);color:var(--ok)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--pat),linear-gradient(180deg,#0a2a5e,#02183c);display:flex;padding-bottom:env(safe-area-inset-bottom,0);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(2,24,60,.35)}
nav button{flex:1;border:0;background:none;color:#a9bbdd;font:inherit;font-size:13px;padding:13px 4px;border-top:3px solid transparent;cursor:pointer}nav button.on{color:var(--yel);border-color:var(--yel);font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd)}.kv:last-child{border:0}.kv b{direction:ltr;text-align:left;word-break:break-all}
.it{cursor:pointer;transition:transform .12s}.it:active{transform:scale(.985)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.chips button{flex:none;border:1.5px solid var(--bd);background:none;color:var(--tx);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{background:var(--yel);color:#07204a;border-color:var(--yel);font-weight:800}
.spin{text-align:center;padding:30px;color:var(--mut)}
.ths{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}.th{width:calc(50% - 5px);text-align:center;font-size:12px;color:var(--mut)}.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--bd);background:#fff}.th button{border:0;background:none;color:var(--err);font:inherit;font-size:12px;cursor:pointer;padding:4px}

/* ---- lux gold theme ---- */
html:root:not(#z){--bg:#060f26;--card:#0e1f48;--tx:#f3ecd8;--mut:#b7c3de;--bd:rgba(212,175,55,.32);--brand:#e6c66b;--yel:#d4af37;--shadow:0 14px 30px rgba(0,0,0,.4);--s0:#f0a04b;--s3:#7fb0ff;--s4:#c39bff;--s5:#e6c66b;--s6:#4ade80;color-scheme:dark}
html:root:not(#z) body{background:radial-gradient(120% 50% at 50% 0%,#12295a 0%,#060f26 55%,#03091a 100%) fixed;font-family:'IBM Plex Sans Arabic',Cairo,Tajawal,system-ui,sans-serif}
html:root:not(#z) header{background:var(--pat),linear-gradient(160deg,#143063,#060f26);box-shadow:inset 0 -1px 0 rgba(212,175,55,.6),0 14px 30px rgba(0,0,0,.45)}
html:root:not(#z) header img{border:1.5px solid #d4af37;border-radius:50%;width:52px;height:52px}
html:root:not(#z) header b,html:root:not(#z) .box h2{font-family:'Amiri',serif;font-size:20px}
html:root:not(#z) header small{color:#e6c66b}
html:root:not(#z) .box{border-radius:20px;background:linear-gradient(160deg,#0e1f48,#050b1c)}
html:root:not(#z) .btn{background:linear-gradient(135deg,#9a7a2a 0%,#f1d98a 30%,#fff4c9 48%,#d4af37 70%,#9a7a2a 100%);color:#1a1405;box-shadow:0 8px 20px rgba(212,175,55,.3),inset 0 1px 0 rgba(255,255,255,.5)}
html:root:not(#z) .btn.g{background:transparent;color:var(--tx);border:1px solid rgba(212,175,55,.5);box-shadow:none}
html:root:not(#z) .btn.ok{background:linear-gradient(135deg,#0f7a4c,#16a06a);color:#fff}
html:root:not(#z) input,html:root:not(#z) select,html:root:not(#z) textarea{background:#08142f;border:1px solid rgba(212,175,55,.35);color:var(--tx)}
html:root:not(#z) nav,html:root:not(#z) .tabs{background:rgba(6,15,38,.94);border-top:1px solid rgba(212,175,55,.5)}

/* ---- cinematic v2 ---- */
html:root:not(#z){--bg:#0a0b10;--card:#12141b;--goldg:linear-gradient(135deg,#9a7a2a,#f1d98a 35%,#fff4c9 50%,#d4af37 75%,#9a7a2a)}
html:root:not(#z) body{background:radial-gradient(120% 40% at 50% 0%,rgba(212,175,55,.13),transparent 62%),radial-gradient(120% 60% at 50% 0%,#14161f 0%,#07080c 55%,#020203 100%) fixed}
html:root:not(#z) .box{background:linear-gradient(160deg,#14161e,#08090d);border-color:rgba(212,175,55,.28);box-shadow:0 10px 30px rgba(0,0,0,.5)}
html:root:not(#z) header{background:radial-gradient(120% 140% at 50% 0%,#1d2030,#08090d);box-shadow:inset 0 -1px 0 rgba(212,175,55,.6),0 14px 30px rgba(0,0,0,.55)}
html:root:not(#z) nav{background:rgba(10,11,16,.95);backdrop-filter:blur(10px)}
html:root:not(#z) input,html:root:not(#z) select,html:root:not(#z) textarea{background:#0a0b10}
main{max-width:860px}
@media(min-width:900px){main{max-width:1040px}.grid{grid-template-columns:repeat(4,1fr)!important}}
.hi{font-family:Amiri,serif;font-size:28px;margin:4px 2px 2px;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 2px 14px;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stc{display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;border:1px solid rgba(212,175,55,.25);border-radius:20px;padding:14px 14px 12px;background:linear-gradient(160deg,#14161e,#08090d);position:relative;overflow:hidden;transition:transform .12s}
.stc:active{transform:scale(.97)}
.stc b{display:block;font-family:Amiri,serif;font-size:38px;line-height:1.1;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr;text-align:start}
.stc span{font-size:13px;color:var(--mut);display:block;margin-top:2px}
.stc::before{content:"";position:absolute;inset-inline-end:12px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--dot,#555)}
.stc.zero b{opacity:.4}
.stc.al{border-color:#d4af37;box-shadow:0 0 0 1px rgba(212,175,55,.35),0 0 26px rgba(212,175,55,.2)}
.stc.wide{grid-column:1/-1}
.qa{display:flex;gap:10px;margin-bottom:12px}.qa .btn{margin:0}
.box.it{border-inline-start:4px solid var(--c,#555)}
.box.it.st0{--c:#f0a04b}.box.it.st1,.box.it.st2{--c:#d4af37}.box.it.st3{--c:#7fb0ff}.box.it.st4{--c:#c39bff}.box.it.st5{--c:#4fd1c5}.box.it.st6{--c:#4ade80}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .bd{position:absolute;top:5px;inset-inline-start:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#d1432f;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.next{font-size:17px;padding:16px}
details.more{margin-top:10px}details.more summary{cursor:pointer;color:var(--mut);font-size:13px;padding:6px 2px}
.ct{display:flex;gap:8px;margin-top:10px}.ct a{flex:1;text-align:center;text-decoration:none;padding:11px;border-radius:13px;border:1px solid rgba(212,175,55,.4);color:var(--tx);font-weight:700;font-size:14px}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* clear font v3 */
html:root:not(#z) body,html:root:not(#z) button,html:root:not(#z) input,html:root:not(#z) select,html:root:not(#z) textarea{font-family:'Cairo','IBM Plex Sans Arabic',Tajawal,system-ui,sans-serif!important;font-size:16px;line-height:1.6;color:#f4f1e8;-webkit-font-smoothing:antialiased}
html:root:not(#z) header b,html:root:not(#z) .box h2,.hi,.stc b,.pg h2{font-family:'Cairo','IBM Plex Sans Arabic',sans-serif!important;font-weight:800;letter-spacing:0}
.hi{font-size:26px}
.stc b{font-size:36px;font-weight:800}
html:root:not(#z) .box h2{font-size:18px}
html:root:not(#z) .btn,html:root:not(#z) button{font-weight:700;font-size:16px}
html:root:not(#z) small,html:root:not(#z) .mut,html:root:not(#z) .sub{color:#c9c4b3!important;font-size:14px}
html:root:not(#z) nav button,html:root:not(#z) nav a{font-size:12.5px;font-weight:600}

function compress(file,max){max=max||1600;return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("compress")),"image/jpeg",.82)};
  img.onerror=()=>rej(new Error("image"));img.src=u})}
async function uploadFile(id,kind,blob,ext){
  const name=`${id}/${kind}-${Date.now()}.${ext}`,B=sb.storage.from("shipment-files");

  if(up.error)throw up.error;
  const r=await sb.rpc("add_shipment_file",{p_ship:id,p_kind:kind,p_path:name});
  if(r.error){await B.remove([name]);throw r.error}
}

  <div class="box"><h2>الدفع</h2>${d.pay.map(p=>`<div class="kv"><span>${p.kind==="adjustment"?"فرق وزن":"الدفعة"}: ${h(PM[p.method]||p.method)}</span><b>${eur(p.amount)} · ${p.status==="paid"?"مدفوع":"معلّق"}</b></div>`).join("")}

function tabs(){const t=[["today","اليوم"]];
  if(can(["support"])||can(["accountant"]))t.push(["ships","الشحنات"]);
  if(can(["herne_staff"]))t.push(["intake","هيرنه"]);
  if(can(["accountant"]))t.push(["pays","الأموال"]);
  if(can(["support"]))t.push(["chat","الرسائل"]);
  t.push(["set","الإعدادات"]);return t}
const BD=k=>k==="pays"?S.pays.length:k==="chat"?chatUnread():0;
function R(){
  const a=$("app"),n=$("nav");$("who").textContent=S.prof?S.prof.name:"";
  if(!S.user){n.hidden=true;a.innerHTML=vLogin();return}
  if(!S.prof||STAFF.indexOf(role())<0){n.hidden=true;a.innerHTML=vDenied();return}
  n.hidden=false;const T=tabs();if(!T.some(x=>x[0]===S.tab)&&S.tab!=="detail")S.tab=T[0][0];
  const cur=S.tab==="detail"?"ships":S.tab;
  n.innerHTML=T.map(([k,l])=>`<button data-a="tab" data-t="${k}" class="${cur===k?"on":""}"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]||""}</svg>${l}${BD(k)?`<span class="bd">${BD(k)}</span>`:""}</button>`).join("");
  a.innerHTML=S.tab==="today"?vToday():S.tab==="ships"?vShips():S.tab==="detail"?vDetail():S.tab==="intake"?vIntake():S.tab==="pays"?vPays():S.tab==="chat"?vChat():vSet();
}

    mo=new Date().toISOString().slice(0,7),ms=S.ships.filter(x=>(x.created_at||"").slice(0,7)===mo),sum=ms.reduce((a,x)=>a+(+x.price||0),0);

  C.push(card(c(3),"في الشحن",'data-a="go" data-t="ships" data-k="3"',"#7fb0ff",false));
  C.push(card(c(5),"وصلت وجاهزة للتسليم",'data-a="go" data-t="ships" data-k="5"',"#4fd1c5",true));
  const rec=S.ships.slice(0,5).map(x=>`<div class="box it st${x.status}" data-a="open" data-id="${h(x.id)}" style="margin-bottom:8px;padding:12px"><div class="row sp"><b dir="ltr">${h(x.id)}</b><span class="tag s${x.status}">${ST[x.status]}</span></div><div class="mut">${h((x.profiles&&x.profiles.name)||"")} ← ${h(x.recipient_name)} · ${eur(x.price)}</div></div>`).join("");
  return `<div class="hi">أهلاً ${h(n)}</div><p class="sub">${new Date().toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long"})} · هيك وضع الشغل اليوم</p>
  <div class="box" style="padding:12px"><div class="row"><input id="t_q" placeholder="ابحث برقم الشحنة أو اسم الزبون" style="margin:0"><button class="btn" data-a="tsearch" style="margin:0;flex:none;width:auto;padding:13px 20px">بحث</button></div></div>
  ${can(["herne_staff"])?`<div class="qa"><button class="btn" data-a="go" data-t="intake">📦 استلام شحنة بهيرنه</button></div>`:""}

  <div class="pg"><h2 style="margin:6px 2px 10px;font-size:17px;font-family:Amiri,serif">آخر الشحنات</h2><a data-a="go" data-t="ships" data-k="all" style="color:var(--yel);cursor:pointer;font-size:13px">عرض الكل ←</a></div>${rec||`<div class="box mut" style="text-align:center">ما في شحنات بعد</div>`}`}
function vSet(){return vAcct()+(role()==="admin"?vTeam():"")}
/* actions */
async function loadInv(){const r=await sb.from("invoices").select("number,issued_at,amount,shipment_id").order("issued_at",{ascending:false}).limit(15);S.inv=r.error?null:(r.data||[])}
async function reload(){await Promise.all([loadShips(),loadPays()])}
async function act(a,el){
  if(a==="tab"||a==="go"){msg(null);S.ires=null;S.tab=el.dataset.t;if(a==="go"&&el.dataset.k!=null)S.flt=el.dataset.k;if(a==="go"&&S.tab==="ships")S.q="";
    if(S.tab==="today"){await Promise.all([loadShips(),loadPays(),can(["support"])?loadThreads():0])}
    if(S.tab==="ships")await loadShips();if(S.tab==="pays"){await Promise.all([loadPays(),loadInv()])}if(S.tab==="set"&&role()==="admin")await loadTeam();if(S.tab==="chat"){S.chat.sel=null;await loadThreads()}window.scrollTo(0,0);return R()}
  if(a==="tsearch"){S.q=($("t_q")||{}).value||"";S.flt="all";S.tab="ships";await loadShips();return R()}
  if(a==="setrole"){const e=($("t_e").value||"").trim().toLowerCase(),r=$("t_r").value;S.tm={e,r};
    if(!e){msg("اكتب إيميل الموظف");return R()}
    S.busy=true;msg(null);R();
    const x=await sb.rpc("set_user_role",{p_email:e,p_role:r});S.busy=false;
    if(x.error)msg(em(x.error));else{msg("تم تعديل الدور ✓","o");S.tm={e:"",r:"herne_staff"};await loadTeam()}
    return R()}
  if(a==="thr"){S.chat.sel={tid:+el.dataset.tid,name:el.dataset.name,email:el.dataset.email,phone:el.dataset.phone};S.chat.msgs=[];S.chat.draft="";S.chat.err="";await loadThread();return R()}
  if(a==="thrback"){S.chat.sel=null;await loadThreads();return R()}
  if(a==="csend"){const v=(S.chat.draft||"").trim();if(!v||S.busy||!S.chat.sel)return;
    S.busy=true;S.chat.err="";R();
    const r=await sb.rpc("chat_reply",{p_thread:S.chat.sel.tid,p_body:v});S.busy=false;
    if(r.error){S.chat.err=em(r.error);return R()}
    S.chat.draft="";await loadThread();R();const m=$("cmsgs");if(m)m.scrollTop=m.scrollHeight;return}
  if(a==="drev"){const ok=el.dataset.ok==="1",w=($("dw"+el.dataset.did)||{}).value||"";
    if(!ok&&w.trim().length<3){S.dd={...S.dd,err:"اكتب سبب الرفض (3 أحرف على الأقل)"};return R()}
    const r=await sb.rpc("review_doc",{p_doc:+el.dataset.did,p_ok:ok,p_why:ok?null:w.trim()});
    if(r.error){S.dd={...S.dd,err:ferr(r.error)};return R()}
    await loadDocs(el.dataset.id);return R()}
  if(a==="fdel"){const r=await sb.rpc("delete_shipment_file",{p_id:+el.dataset.fid});
    if(r.error){S.fl={...S.fl,err:ferr(r.error)};return R()}
    if(r.data)await sb.storage.from("shipment-files").remove([r.data]);
    await loadFiles(el.dataset.id);return R()}
  if(a==="sigclr"){const c=$("sigc");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);sigDirty=false;return}
  if(a==="sigsave"){const c=$("sigc");if(!c||!sigDirty){S.fl={...S.fl,err:"ارسمي التوقيع أول"};return R()}
    const id=el.dataset.id;S.fl={...S.fl,busy:true,err:""};R();
    try{const b=await new Promise(r=>c.toBlob(r,"image/png"));await uploadFile(id,"signature",b,"png");await loadFiles(id);sigDirty=false}catch(x){S.fl={...S.fl,busy:false,err:ferr(x)}}
    return R()}
  if(a==="flt"){S.flt=el.dataset.k;return R()}
  if(a==="open")return openShip(el.dataset.id);
  if(a==="logout"){await sb.auth.signOut();return}
  if(S.busy)return;
  if(a==="login"){const e=$("a_e").value.trim(),p=$("a_p").value;
    if(!e||!p){msg("اكتب الإيميل وكلمة السر");return R()}
    S.busy=true;msg(null);R();
    const r=await sb.auth.signInWithPassword({email:e,password:p});S.busy=false;if(r.error)msg(em(r.error));return R()}
  if(a==="pay"){S.busy=true;msg(null);R();
    const r=await sb.rpc("confirm_payment",{p_ship:el.dataset.id});S.busy=false;
    if(r.error)msg(em(r.error));else{msg("تم تأكيد الدفع وإصدار الفاتورة","o");await loadPays()}
    return S.tab==="detail"?openShip(el.dataset.id).then(()=>{}):R()}
  if(a==="setst"){S.busy=true;msg(null);R();
    const r=await sb.rpc("set_status",{p_ship:el.dataset.id,p_status:+el.dataset.st});S.busy=false;
    if(r.error){msg(em(r.error));return R()}
    return openShip(el.dataset.id)}
  if(a==="deliver"){const by=($("d_by")||{}).value;S.busy=true;msg(null);R();
    const r=await sb.rpc("record_delivery",{p_ship:el.dataset.id,p_by:by||""});S.busy=false;
    if(r.error){msg(em(r.error));return R()}
    return openShip(el.dataset.id)}
  if(a==="intake"){const i=S.intake;
    if(!i.id||i.pin.length!==4||!(+i.w>0)||!(+i.n>=1)){S.ires={t:"اكتب رقم الشحنة والـ PIN (4 أرقام) والوزن وعدد الطرود",k:"e"};return R()}
    S.busy=true;S.ires=null;msg(null);R();
    const r=await sb.rpc("verify_intake",{p_ship:i.id.toUpperCase(),p_pin:i.pin,p_weight:+i.w,p_packages:+i.n,p_cond:i.c});S.busy=false;
    if(r.error)S.ires={t:em(r.error),k:"e"};
    else{const x=(r.data&&r.data[0])||{};
      if(x.result==="ok"){S.intakeShip=i.id.toUpperCase();await loadFiles(S.intakeShip);S.ires={t:`تم الاستلام ✓  السعر ${eur(x.price_before)} ← ${eur(x.price_after)}${+x.diff?" (فرق "+eur(x.diff)+")":""}`,k:"o"};S.intake={id:"",pin:"",w:"",n:"1",c:"ok"}}
      else if(x.result==="wrong_pin")S.ires={t:"الرمز غلط. المحاولات محدودة (5).",k:"e"};
      else if(x.result==="locked")S.ires={t:"الشحنة مقفلة بعد 5 محاولات غلط. تواصلي مع المدير.",k:"e"};
      else S.ires={t:"نتيجة غير متوقعة",k:"e"}}
    return R()}
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el)act(el.dataset.a,el)});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="s_q"){S.q=e.target.value;const l=$("sl");if(l)l.innerHTML=shipList();return}
  if(id==="c_in"){S.chat.draft=e.target.value;return}
  const k={i_id:"id",i_pin:"pin",i_w:"w",i_n:"n",i_c:"c"}[id];if(k)S.intake[k]=e.target.value});


/* support chat */
const chatUnread=()=>(S.chat.threads||[]).reduce((n,t)=>n+(+t.unread||0),0);
async function loadThreads(){
  const r=await sb.rpc("chat_threads_list");
  if(!r.error)S.chat.threads=r.data||[];
}
async function loadThread(){
  const c=S.chat.sel;if(!c)return;
  const r=await sb.from("chat_messages").select("id,from_staff,body,at").eq("thread_id",c.tid).order("id",{ascending:true}).limit(500);
  if(!r.error)S.chat.msgs=r.data||[];
  await sb.rpc("chat_mark_read_staff",{p_thread:c.tid});
}
function vChat(){
  const c=S.chat;
  if(!c.sel){
    return `<div class="box"><h2>الدردشة (${c.threads.length})</h2><p class="mut">رسائل الزبائن للدعم. الرسائل الجديدة بتظهر أول.</p></div>`+
    (c.threads.map(t=>`<button class="box" data-a="thr" data-tid="${t.thread_id}" data-name="${h(t.name)}" data-email="${h(t.email)}" data-phone="${h(t.phone||"")}" style="display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer">
      <div class="row sp"><b>${h(t.name)}</b>${+t.unread?`<span class="tag s0" style="background:var(--err);color:#fff">${t.unread} جديد</span>`:`<span class="mut">${dt(t.last_at)}</span>`}</div>
      <div class="mut" style="margin-top:4px">${t.last_from_staff?"أنتم: ":""}${h((t.last_body||"").slice(0,90))}</div></button>`).join("")||`<div class="box mut" style="text-align:center">ما في رسائل بعد</div>`);
  }
  const s=c.sel;
  return `<button class="btn g" data-a="thrback" style="margin:0 0 10px">← الدردشات</button>
  <div class="box"><h2>${h(s.name)}</h2><div class="kv"><span>الإيميل</span><b>${h(s.email)}</b></div>${s.phone?`<div class="kv"><span>الهاتف</span><b>${h(s.phone)}</b></div>`:""}</div>
  <div class="box"><div id="cmsgs" style="max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px">${c.msgs.map(m=>`<div style="align-self:${m.from_staff?"flex-start":"flex-end"};max-width:84%;background:${m.from_staff?"var(--brand)":"var(--bg)"};color:${m.from_staff?"#fff":"var(--tx)"};padding:9px 12px;border-radius:14px;border:1px solid var(--bd)"><div>${h(m.body).split("\n").join("<br>")}</div><div style="font-size:11px;opacity:.7;margin-top:3px" dir="ltr">${dt(m.at)}</div></div>`).join("")||`<span class="mut">ما في رسائل</span>`}</div></div>
  <div class="box"><textarea id="c_in" rows="3" placeholder="اكتب ردك…" style="width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)">${h(c.draft)}</textarea>
  ${c.err?`<div class="msg e">${h(c.err)}</div>`:""}<button class="btn" data-a="csend" ${S.busy?"disabled":""}>إرسال الرد</button></div>`;
}
let chatTick=0;
setInterval(async()=>{
  if(document.hidden||!S.prof||!can(["support"]))return;
  chatTick++;
  const typing=document.activeElement&&document.activeElement.id==="c_in";
  if(S.tab==="chat"&&S.chat.sel){
    const n=S.chat.msgs.length;await loadThread();
    if(S.chat.msgs.length!==n&&!typing){R();const m=$("cmsgs");if(m)m.scrollTop=m.scrollHeight}
  }else if(S.tab==="chat"||chatTick%4===0){
    const u=chatUnread(),n=S.chat.threads.length;await loadThreads();
    if((chatUnread()!==u||S.chat.threads.length!==n)&&!typing)R();
  }
  if(S.tab==="today"&&S.prof&&!(document.activeElement&&document.activeElement.id==="t_q")&&chatTick%4===0){await Promise.all([loadShips(),loadPays()]);R()}
},8000);

async function onSession(sess){
  S.user=sess?sess.user:null;S.prof=null;
  if(S.user){const p=await sb.from("profiles").select("name,email,role").eq("id",S.user.id).single();S.prof=p.data;
    if(S.prof&&STAFF.indexOf(S.prof.role)>=0){await reload();if(can(["support"]))await loadThreads()}}
  R();
}
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>onSession(sess),0)});
</script></body></html>
