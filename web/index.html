<style>
:root{--bg:#071533;--bg2:#02060f;--card:#0d1f45;--line:rgba(212,175,55,.28);--g1:#fff4c9;--g2:#d4af37;--g3:#8a6a1f;--tx:#e9eefb;--mut:#aab6d3;--gold:linear-gradient(135deg,#f1d98a,#d4af37 50%,#a98322)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Cairo,system-ui,Arial,sans-serif;background:var(--bg2);color:var(--tx);line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0%,#173a7a 0,#071533 45%,#02060f 100%)}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:auto;padding:0 20px}
h1,h2,h3{font-family:Amiri,Cairo,serif;line-height:1.3;margin:0}
.gt{background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(7,21,51,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-inline-end:auto}
.brand img{width:38px;height:38px;border-radius:10px}
.brand span{font-family:Amiri,serif;font-size:20px}
.lang{display:flex;gap:4px;direction:ltr}
.lang button{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--g2);border-radius:20px;padding:3px 10px;cursor:pointer}
.lang button.on{background:var(--gold);color:#07204a;font-weight:700;border-color:transparent}
.nl{display:flex;gap:18px;font-size:14px;color:var(--mut)}.nl a:hover{color:var(--g1)}
@media(max-width:760px){.nl{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--gold);color:#07204a;box-shadow:0 8px 24px rgba(212,175,55,.25);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--g1);border:1.5px solid var(--g2);box-shadow:none}
/* hero */
.hero{padding:70px 0 56px;text-align:center;position:relative}
.logo{width:150px;height:150px;margin:0 auto 20px;position:relative}
.logo svg{width:100%;height:100%}
.hero h1{font-size:clamp(34px,7vw,58px)}
.hero p{max-width:640px;margin:14px auto 26px;color:var(--mut);font-size:18px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* route */
.route{margin:44px auto 0;max-width:720px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(23,58,122,.45),rgba(7,21,51,.6));padding:22px 18px}
.route svg{width:100%;height:auto;display:block}
.route .lbl{display:flex;justify-content:space-between;font-weight:700;color:var(--g1);direction:ltr;font-size:14px;margin-top:6px}
/* sections */
section{padding:60px 0}
.h{text-align:center;margin-bottom:34px}.h h2{font-size:clamp(28px,5vw,40px)}.h p{color:var(--mut);margin:8px 0 0}
.h::after{content:"";display:block;width:70px;height:3px;border-radius:3px;margin:14px auto 0;background:var(--gold)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:linear-gradient(160deg,var(--card),#0a1836);border:1px solid var(--line);border-radius:20px;padding:22px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:var(--g2)}
.ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--gold);margin-bottom:12px}
.ic svg{width:26px;height:26px;stroke:#07204a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:21px;margin-bottom:6px;color:var(--g1)}.card p{margin:0;color:var(--mut);font-size:15px}
.steps{counter-reset:s}.steps .card{position:relative;padding-top:34px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-16px;inset-inline-start:20px;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#07204a;font-weight:800;display:grid;place-items:center}
/* calc */
.calc{max-width:560px;margin:auto;background:linear-gradient(160deg,var(--card),#0a1836);border:1px solid var(--g2);border-radius:24px;padding:26px}
.calc label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.calc select,.calc input{width:100%;font:inherit;color:#fff;background:#071533;border:1px solid var(--line);border-radius:12px;padding:12px}
.calc .btn{width:100%;margin-top:16px}
#res{margin-top:16px;text-align:center;font-size:15px;color:var(--mut);min-height:30px}
#res b{display:block;font-family:Amiri,serif;font-size:38px;font-weight:700;background:var(--gold);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.fine{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
/* herne */
.two{display:grid;gap:20px;grid-template-columns:1fr 1fr}@media(max-width:760px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.row svg{flex:none;width:22px;height:22px;stroke:var(--g2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:4px}
.map{border-radius:20px;overflow:hidden;border:1px solid var(--line);min-height:260px;background:#0a1836}.map iframe{width:100%;height:100%;min-height:260px;border:0;filter:invert(.92) hue-rotate(180deg) saturate(.7)}
/* footer */
footer{border-top:1px solid var(--line);padding:30px 0 90px;color:var(--mut);font-size:13px;text-align:center}
footer a{color:var(--g2)}footer .l{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.fab{position:fixed;inset-inline-start:16px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:10px}
.fab a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:26px;height:26px;stroke:#07204a;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rv{opacity:0;transform:translateY(18px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* cinematic */
:root{--bg:#0b0c12;--bg2:#030305;--card:#12141c}
body{background:radial-gradient(120% 60% at 50% 0%,#12141d 0%,#050507 60%,#020203 100%) fixed}
nav{background:rgba(5,5,8,.8)}
.card,.calc{background:linear-gradient(160deg,#14161f,#0a0b10)}
.calc select,.calc input{background:#07080c}
.hero{padding:96px 0 70px;isolation:isolate;overflow:hidden}
.hero>.w{position:relative;z-index:2}
.cine{position:absolute;inset:0;z-index:0;pointer-events:none}
.cine svg{position:absolute;left:50%;top:50%;width:min(1100px,150vw);height:auto;transform:translate(-50%,-50%);opacity:.9;-webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 40%,transparent 75%)}
.cine .ray{position:absolute;left:50%;top:38%;width:1400px;height:1400px;margin:-700px 0 0 -700px;background:conic-gradient(from 0deg,transparent 0 8%,rgba(212,175,55,.10) 10%,transparent 13% 33%,rgba(212,175,55,.08) 36%,transparent 40% 58%,rgba(255,244,201,.09) 61%,transparent 65% 83%,rgba(212,175,55,.08) 86%,transparent 90%);animation:cr 70s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
.cine .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.75) 100%)}
.cine .pt{position:absolute;inset:0}
.cine .pt b{position:absolute;width:3px;height:3px;border-radius:50%;background:#f1d98a;box-shadow:0 0 8px 2px rgba(241,217,138,.6);opacity:0;animation:cp 9s linear infinite}
@keyframes cr{to{transform:rotate(360deg)}}
@keyframes cp{0%{transform:translateY(40px);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.logo{width:190px;height:190px;position:relative}
.logo::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(212,175,55,.5);border-top-color:#fff4c9;border-bottom-color:transparent;animation:cr 9s linear infinite;box-shadow:0 0 40px rgba(212,175,55,.25)}
.logo::after{content:"";position:absolute;inset:-34px;border-radius:50%;border:1px dashed rgba(212,175,55,.25);animation:cr 40s linear infinite reverse}
.logo svg{animation:lb 5s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(212,175,55,.35))}
@keyframes lb{50%{transform:scale(1.04)}}
.hero h1{text-shadow:0 8px 50px rgba(0,0,0,.8)}
.hero::before,.hero::after{content:"";position:absolute;left:0;right:0;height:46px;background:#000;z-index:3}
.hero::before{top:0;display:none}.hero::after{bottom:0;background:linear-gradient(0deg,#030305,transparent)}
.route{background:rgba(8,9,13,.55);backdrop-filter:blur(6px)}
.band{position:relative;padding:90px 0;text-align:center;overflow:hidden;border-block:1px solid var(--line);background:radial-gradient(ellipse at 50% 50%,rgba(212,175,55,.10),transparent 60%),#040406}
.band h2{font-size:clamp(26px,5vw,44px);margin:0 0 10px}.band p{color:var(--mut);max-width:560px;margin:0 auto}
.band .tr{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.5),transparent)}
.band .tk{position:absolute;top:calc(50% - 15px);left:-60px;font-size:26px;animation:tk 12s linear infinite;filter:drop-shadow(0 0 10px rgba(212,175,55,.6))}
@keyframes tk{to{left:calc(100% + 60px)}}
.band .w{position:relative;z-index:2}
@media(prefers-reduced-motion:reduce){.cine .ray,.cine .pt b,.logo::before,.logo::after,.logo svg,.band .tk{animation:none}}
body::before{background:radial-gradient(circle at 50% 0%,#15171f 0,#07080c 45%,#020203 100%)!important}
.route{background:rgba(8,9,13,.55)}.logo svg circle[fill]:not([fill=none]){fill:#07080c}
.cine svg{top:62%;opacity:.55}.cine .ray{top:30%}
.hero h1,.hero p,.cta{position:relative;z-index:3}
.band .tr{top:auto;bottom:34px}.band .tk{top:auto;bottom:20px}.band{padding-bottom:84px}
.band .tk{width:190px;left:auto;right:auto;top:auto;bottom:26px;filter:drop-shadow(0 0 12px rgba(212,175,55,.35));animation:none}
.band .tk svg{display:block;width:100%;height:auto}
.band .tr{bottom:26px}
html[dir=rtl] .band .tk{animation:tkr 14s linear infinite}
html[dir=ltr] .band .tk{animation:tkl 14s linear infinite}
html[dir=ltr] .band .tk svg{transform:scaleX(-1)}
@keyframes tkr{from{left:100%}to{left:-200px}}
@keyframes tkl{from{left:-200px}to{left:100%}}
.wh .sp{animation:cr .5s linear infinite}.wh g{transform-box:fill-box}
.wh g{transform-origin:center}
html[dir=ltr] .band .tk svg text{transform-box:fill-box;transform-origin:center;transform:scaleX(-1)}
.band{padding-bottom:130px}.band .tk,.band .tr{bottom:28px}
.map{position:relative;background:radial-gradient(circle at 50% 40%,#15171f,#050507)!important}
.map .mp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#f1d98a;font-weight:700}
.map iframe{position:relative;z-index:1;background:transparent}
.brand img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 18px rgba(212,175,55,.35);animation:bsw 6s ease-in-out infinite}
@keyframes bsw{0%,100%{transform:perspective(300px) rotateY(-60deg)}50%{transform:perspective(300px) rotateY(60deg)}}
@media(prefers-reduced-motion:reduce){.brand img{animation:none}}
