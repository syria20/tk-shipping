<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T.K Group — تطبيق الشحن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:50%;--tg:-18px;--bg:#f2f5fa;--card:#fff;--ink:#0b1b3a;--mut:#5a6a8a;--line:#e0e7f2;--brand:#0a2f6b;--yel:#ffd400;--ok:#16a06a;--shadow:0 6px 22px rgba(8,30,70,.10);--gold:#c9a24a;--pat:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2756%27 height=%2756%27 viewBox=%270 0 56 56%27%3E%3Cg fill=%27none%27 stroke=%27%23e8d9a8%27 stroke-opacity=%27.17%27 stroke-width=%271%27%3E%3Cpath d=%27M28 5l6.5 16.5L51 28l-16.5 6.5L28 51l-6.5-16.5L5 28l16.5-6.5z%27/%3E%3Ccircle cx=%2728%27 cy=%2728%27 r=%279%27/%3E%3Cpath d=%27M0 0l9 9M56 0l-9 9M0 56l9-9M56 56l-9-9%27/%3E%3C/g%3E%3C/svg%3E");--st0:#b45f06;--st3:#1d62c9;--st4:#7a3fc4;--st5:#0b8a86;--st6:#16804f;--m-road:#946b2d;--m-air:#0e86c9;--m-sea:#1b8a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#02183c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07142e;--card:#0e2247;--ink:#eef2fb;--line:#2b4a86;--brand:#8db4f5;--mut:#a9bbdd;--st0:#f0a04b;--st3:#7fb0ff;--st4:#c39bff;--st5:#4fd1c5;--st6:#4ade80;--m-road:#d9a85c;--m-air:#5cc0f2;--m-sea:#4fcf9f;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07142e;--card:#0e2247;--ink:#eef2fb;--line:#2b4a86;--brand:#8db4f5;--mut:#a9bbdd;--st0:#f0a04b;--st3:#7fb0ff;--st4:#c39bff;--st5:#4fd1c5;--st6:#4ade80;--m-road:#d9a85c;--m-air:#5cc0f2;--m-sea:#4fcf9f;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;display:flex;justify-content:center}
svg{display:block;flex:none}
button{font-family:inherit}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#splash{position:absolute;inset:0;z-index:20;background:var(--pat),radial-gradient(circle at 50% 40%,#0a4590,#02183c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:78%;max-width:340px;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);animation:rise .9s ease-out both}
#splash i{display:block;width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#splash i::after{content:"";display:block;height:100%;background:var(--yel);animation:load 1.3s ease-in-out both}
@keyframes rise{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes load{from{transform:translateX(100%)}to{transform:none}}

.top{background:var(--pat),linear-gradient(160deg,#0a3a7d,#02183c);color:#fff;padding:14px 18px 58px;border-radius:0 0 28px 28px}
.top.slim{padding-bottom:18px}.top.slim .bar b{font-size:19px}
.bar{display:flex;align-items:center;gap:12px}
.bar img{width:92px;height:82px;border-radius:16px;object-fit:cover;border:1.5px solid rgba(232,217,168,.5)}
.bar b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.bar small{color:#c9d6f0;font-size:12px}
.bar .back{margin-inline-start:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;display:grid;place-items:center;cursor:pointer}
.top h1{margin:18px 0 0;font-size:26px;font-weight:800;line-height:1.35}
main{flex:1;overflow-y:auto}
.pad{padding:0 16px 24px}
.pt{padding-top:16px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.lift{margin-top:-44px;position:relative}
h3{margin:0 0 10px;font-size:16px;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin:0}
.srch{display:flex;gap:8px}
.srch button{width:50px;border:0;border-radius:12px;background:var(--yel);color:#07204a;display:grid;place-items:center;cursor:pointer}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.route label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.route .sw{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--brand);display:grid;place-items:center;cursor:pointer}
select,input{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt2 button:last-child:nth-child(odd){grid-column:1/-1}
.opt3 button,.opt2 button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 4px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.opt3 button.on,.opt2 button.on{border-color:var(--brand);background:rgba(10,47,107,.07);color:var(--brand);font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt3 button.on,:root:not([data-theme="light"]) .opt2 button.on{background:rgba(127,168,238,.14)}}
.step{display:flex;align-items:center;gap:10px}
.step button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.step input{text-align:center;font-size:20px;font-weight:800;height:46px}
textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600;resize:vertical}textarea:focus-visible{outline:3px solid var(--yel);outline-offset:2px}.chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:none;color:var(--mut);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.sum{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;color:var(--mut)}
.r b{color:var(--ink);text-align:end}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#0a3a7d,#02183c);color:#fff}
.total small{color:#c9d6f0}
.total b{font-size:30px;color:var(--yel);font-weight:800}
.cta{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--yel);color:#07204a;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(255,212,0,.28)}
.cta.ghost{background:none;box-shadow:none;border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;margin-top:8px;padding:11px}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.svc button{background:none;border:0;color:var(--ink);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.svc span{width:54px;height:54px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--brand)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px}
.sec b{font-size:17px}.sec small{color:var(--mut)}
.li{display:block;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;color:var(--ink);cursor:pointer}
.li .t{display:flex;align-items:center;gap:12px}
.li .ico{width:42px;height:42px;border-radius:14px;background:rgba(10,47,107,.09);color:var(--brand);display:grid;place-items:center}
.li .t div b{display:block;font-size:15px}
.li .t div small{color:var(--mut);font-size:12px}
.li .chip{margin-inline-start:auto}
.li p{margin:10px 0 0;color:var(--mut);font-size:13px}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--brand)}
.lbl{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.err{color:#d6453d;font-size:13px;margin-top:8px}
.pm{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px;margin-bottom:8px;cursor:pointer;font-size:15px;font-weight:600}
.pm.on{border-color:var(--brand)}.pm em{margin-inline-start:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.pm.on em{border:6px solid var(--brand)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--ink);white-space:nowrap}
.chip.ok{background:rgba(22,160,106,.16);color:var(--ok)}
.rt{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.rt .bar2{flex:1;height:4px;background:var(--line);border-radius:4px;position:relative}
.rt .bar2 i{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--brand);border-radius:4px}
.rt .bar2 span{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;transform:translate(var(--tx),-50%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt .bar2 span{color:#02183c}}
.big{font-size:22px;font-weight:800;margin:0 0 4px}
.tl{list-style:none;margin:6px 0 0;padding:0}
.tl li{position:relative;padding:0 0 14px 0;padding-inline-start:26px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.tl li::after{content:"";position:absolute;inset-inline-start:5px;top:19px;bottom:-5px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done{color:var(--ink);font-weight:700}.tl li.done::before,.tl li.done::after{background:var(--sc,var(--brand))}
.tl li em{font-style:normal;font-weight:400;color:var(--mut)}
.qrb{display:flex;gap:14px;align-items:center}
.qrb .q{background:#fff;color:#0b1b3a;padding:8px;border-radius:12px;border:1px solid var(--line)}
.pin{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--brand)}
.empty{text-align:center;color:var(--mut);padding:30px 12px}
.empty svg{margin:0 auto 10px;color:var(--line)}
.done-ic{width:84px;height:84px;border-radius:50%;background:rgba(22,160,106,.14);color:var(--ok);display:grid;place-items:center;margin:22px auto 22px}
.done-ic path{stroke-dasharray:30;stroke-dashoffset:30;animation:dr .6s .15s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px;font-weight:600;width:100%;background:none;border-inline:0;border-bottom:0;color:var(--ink);cursor:pointer;text-align:start}
.tg:first-of-type{border-top:0}
.tg i{width:44px;height:26px;border-radius:26px;background:var(--line);position:relative;transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on i{background:var(--ok)}.tg.on i::after{transform:translateX(var(--tg))}
html[dir="ltr"]{--tx:-50%;--tg:18px}
html[dir="ltr"] .back svg{transform:scaleX(-1)}
html[dir="ltr"] input[dir="ltr"]{text-align:left!important}
.tkv{display:grid;place-items:center;transform:scaleX(-1)}html[dir="ltr"] .tkv{transform:none}
.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tmap{position:relative;margin:16px 0 44px}.tmap>svg{width:100%;height:auto;display:block}html[dir="rtl"] .tmap>svg{transform:scaleX(-1)}.tmap .nl{position:absolute;top:100%;margin-top:4px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;transform:translateX(var(--tx))}
.wa{background:rgba(37,211,102,.14);border:1px solid rgba(37,211,102,.35);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.6}.wa small{display:block;opacity:.6;font-size:11px}
.star{border:0;background:none;font-size:34px;line-height:1;color:var(--yel);cursor:pointer;padding:2px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--ink)}.badge.ok{background:rgba(22,160,106,.18);color:var(--ok)}
.lgb{display:flex;align-items:center;gap:6px;margin-inline-start:auto;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}.card .lgb{color:var(--ink);border-color:var(--line);margin-inline-start:0}
.lpb{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}.lpb.on{border-color:var(--brand);color:var(--brand);font-weight:800;background:rgba(10,47,107,.07)}
.lg{display:flex;gap:6px;margin-inline-start:auto}
.lg button{border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer}
.lg button[aria-pressed="true"]{background:var(--yel);color:#07204a;border-color:var(--yel)}
.card .lg{margin:0;justify-content:center}
.card .lg button{color:var(--ink);border-color:var(--line)}
.card .lg button[aria-pressed="true"]{background:var(--yel);color:#07204a;border-color:var(--yel)}
.note{text-align:center;font-size:12px;color:var(--mut);margin:6px 0 0}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;min-width:0;background:none;border:0;padding:9px 2px 11px;color:var(--mut);font-size:11.5px;white-space:nowrap;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--brand);font-weight:800}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
/* ===== design v2 ===== */
.tmap .halo{opacity:.5;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.55}to{transform:scale(2.1);opacity:0}}
.bioB{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:1.5px solid var(--brand);background:var(--card);color:var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:14px;cursor:pointer;font-size:16px;box-shadow:var(--shadow);transition:transform .12s}
.bioB:active{transform:scale(.98)}.bioB .bi{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}.bioB b{display:block;font-size:16px}.bioB small{color:var(--mut);font-size:12px}
.bioI{width:116px;height:116px;border-radius:50%;margin:6px auto 8px;display:grid;place-items:center;color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent);position:relative;overflow:hidden}
.bioI.scan::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--yel);animation:ring 1.2s ease-out infinite}
.bioI.scan i{position:absolute;left:14%;right:14%;height:3px;border-radius:3px;background:var(--yel);box-shadow:0 0 10px var(--yel);animation:scn 1.1s ease-in-out infinite alternate}
@keyframes scn{from{top:22%}to{top:76%}}
.bioI.ok{color:var(--ok);background:rgba(22,160,106,.14);animation:popin .4s cubic-bezier(.2,1.4,.4,1) both}

[data-st="0"],[data-st="1"],[data-st="2"]{--sc:var(--st0)}[data-st="3"]{--sc:var(--st3)}[data-st="4"]{--sc:var(--st4)}[data-st="5"]{--sc:var(--st5)}[data-st="6"]{--sc:var(--st6)}
.chip[data-st]{background:color-mix(in srgb,var(--sc) 16%,transparent);color:var(--sc)}
.ico.m-road,.opt3 button.m-road svg{color:var(--m-road)}.ico.m-air,.opt3 button.m-air svg{color:var(--m-air)}.ico.m-sea,.opt3 button.m-sea svg{color:var(--m-sea)}
.li .ico.m-road{background:color-mix(in srgb,var(--m-road) 16%,transparent)}.li .ico.m-air{background:color-mix(in srgb,var(--m-air) 16%,transparent)}.li .ico.m-sea{background:color-mix(in srgb,var(--m-sea) 16%,transparent)}
.opt3 button.m-road.on{border-color:var(--m-road);background:color-mix(in srgb,var(--m-road) 12%,transparent);color:var(--m-road)}
.opt3 button.m-air.on{border-color:var(--m-air);background:color-mix(in srgb,var(--m-air) 12%,transparent);color:var(--m-air)}
.opt3 button.m-sea.on{border-color:var(--m-sea);background:color-mix(in srgb,var(--m-sea) 12%,transparent);color:var(--m-sea)}
.tl li.cur::before{background:var(--yel);box-shadow:0 0 0 4px rgba(255,212,0,.35);animation:pulse 1.6s ease-in-out infinite}
.tl li.cur::after{background:var(--line)}.tl li.cur{color:var(--ink);font-weight:800}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,212,0,0)}}
.pb{height:5px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}.pb i{display:block;height:100%;border-radius:5px;background:var(--sc,var(--brand))}
.lg button[aria-pressed="true"]{background:#fff;color:#0a2f6b;border-color:#fff}
.card .lg button[aria-pressed="true"]{background:var(--brand);color:var(--card);border-color:var(--brand)}
/* hero */
.hero{display:block;width:100%;text-align:start;border:0;cursor:pointer;color:#fff;background:var(--pat),linear-gradient(160deg,#0a3a7d,#02183c);border-radius:22px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 10px 26px rgba(2,24,60,.28);--line:rgba(255,255,255,.22);--card:#12408a;--mut:#c9d6f0;--ink:#fff;--brand:#fff;--st0:#f0a04b;--st3:#7fb0ff;--st4:#c39bff;--st5:#4fd1c5;--st6:#4ade80}
.hero .hh{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero small{display:block;color:#c9d6f0;font-size:12px}.hero b{font-size:18px;letter-spacing:.5px}
.hero .tmap{margin:12px 0 40px}.hero .hf{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#dbe5fa;align-items:center}.hero .hf span{display:flex;gap:6px;align-items:center}
.svc{grid-template-columns:repeat(4,1fr)}
/* nav */
nav{position:relative;z-index:5;align-items:flex-end}
nav button.fab{overflow:visible;color:var(--ink)}
nav button.fab .fb{width:58px;height:58px;border-radius:50%;margin-top:-26px;background:var(--yel);color:#07204a;display:grid;place-items:center;border:4px solid var(--bg);box-shadow:0 8px 18px rgba(255,212,0,.38)}
nav button.fab.on{color:var(--ink)}
/* motion */
.cta,.li,.pm,.svc button,nav button,.opt3 button,.opt2 button,.lpb,.hero{transition:transform .12s ease}
.cta:active,.li:active,.pm:active,.svc button:active,nav button:active,.opt3 button:active,.opt2 button:active,.lpb:active,.hero:active{transform:scale(.97)}
.err{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
html[dir="rtl"]{--sl:-22px}html[dir="ltr"]{--sl:22px}
#main.pg>.top,#main.pg>.pad{animation:pgin .28s ease-out}
@keyframes pgin{from{opacity:0;transform:translateX(var(--sl))}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}

/* ---- customer documents (contents list, customs papers) ---- */
async function loadDocs(){
  const r=await sb.from("shipment_docs").select("id,shipment_id,name,status,why,file_path").not("file_path","is",null).order("id");
  const rows=r.data||[];s.ships.forEach(x=>{x.docs=[]});if(r.error||!rows.length)return;
  const u=await sb.storage.from("shipment-docs").createSignedUrls(rows.slice(0,100).map(d=>d.file_path),3600),m={};
  (u.data||[]).forEach(d=>{if(d.path&&d.signedUrl)m[d.path]=d.signedUrl});
  s.ships.forEach(x=>{x.docs=rows.filter(d=>d.shipment_id===x.id).map(d=>({id:d.id,name:d.name,st:d.status,why:d.why||"",url:m[d.file_path]||""}))});
}
const DOC_NAMES=["قائمة المحتويات","وثيقة جمرك","فاتورة البضاعة","مستند آخر"];

window.docsCard=function(x){
  const D=x.docs||[],chip={pending:["قيد المراجعة","#b7791f"],ok:["مقبول","#1f8a4c"],bad:["مرفوض","#c0392b"]};
  const rows=D.map(d=>{const c=chip[d.st]||chip.pending;
    return `<div class="r" style="align-items:flex-start;flex-wrap:wrap;gap:6px"><span>${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(d.name)}</a>`:esc(d.name)}</span><b style="color:${c[1]}">${c[0]}</b>${d.st==="bad"&&d.why?`<span class="sub" style="width:100%;color:#c0392b">السبب: ${esc(d.why)}</span>`:""}${d.st==="pending"?`<button class="cta ghost" style="padding:4px 10px;font-size:12px" onclick="docDel(${d.id})">حذف</button>`:""}</div>`}).join("");

  const up=can?`<select id="dsel-${esc(x.id)}" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card,#fff);color:inherit">${DOC_NAMES.map(n=>`<option>${n}</option>`).join("")}</select><label class="cta ghost" style="display:block;text-align:center;margin-top:8px;cursor:pointer">${s.dc.busy===x.id?"جاري الرفع…":"رفع صورة أو PDF"}<input type="file" class="dfile" accept="image/*,application/pdf" data-ship="${esc(x.id)}" hidden></label>`:"";
  return `<div class="card"><h3>المستندات</h3><p class="sub">ارفع قائمة المحتويات أو وثائق الجمرك. يراجعها فريقنا ويظهر لك هون إن كانت مقبولة.</p>${rows||`<p class="sub">لا توجد مستندات بعد</p>`}${up}${s.dc.err?`<p class="note" style="color:#c0392b">${esc(s.dc.err)}</p>`:""}</div>`;
};
function docCompress(file){return new Promise((res,rej)=>{if(file.type==="application/pdf")return res(file);
  const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",.85)};img.onerror=()=>rej(new Error("img"));img.src=u})}
document.addEventListener("change",async e=>{
  const el=e.target;if(!el||!el.classList||!el.classList.contains("dfile")||!el.files||!el.files[0])return;
  const id=el.dataset.ship,file=el.files[0],name=(document.getElementById("dsel-"+id)||{}).value||"مستند آخر";
  if(file.size>25*1024*1024){s.dc.err="الملف كبير جداً";return keepDraw()}
  s.dc={busy:id,err:""};keepDraw();
  try{
    const blob=await docCompress(file);if(blob.size>8*1024*1024)throw new Error("size");
    const pdf=file.type==="application/pdf",path=`${id}/doc-${Date.now()}.${pdf?"pdf":"jpg"}`,B=sb.storage.from("shipment-docs");
    const up=await B.upload(path,blob,{contentType:pdf?"application/pdf":"image/jpeg",upsert:false});if(up.error)throw up.error;
    const r=await sb.rpc("add_shipment_doc",{p_ship:id,p_name:name,p_path:path});if(r.error){await B.remove([path]);throw r.error}
    await loadDocs();s.dc={busy:"",err:""};
  }catch(x){s.dc={busy:"",err:/size|large|exceed/i.test((x&&x.message)||"")?"الملف كبير (الحد 8 ميغا)":"تعذّر رفع الملف، جرّب مرة ثانية"}}
  keepDraw();
});
window.docDel=async function(id){

/* ---- biometric app lock (WebAuthn: Face ID / Touch ID / fingerprint). Device-side lock on top of the saved session. ---- */
const BIO_K="tk-bio2";
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const bioRec=()=>lsGet(BIO_K,null);
let bioSup=false;
try{if(window.isSecureContext&&window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable)
  PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(v=>{bioSup=!!v;try{draw()}catch(e){}}).catch(()=>{})}catch(e){}
window.bioCard=function(){
  if(!s.user||!bioSup)return "";
  const on=!!(bioRec()&&bioRec().uid===s.user.id);
  return `<div class="card"><button class="tg ${on?"on":""}" onclick="bioToggle()" style="border-top:0">${ic("finger",22)}<span style="flex:1;margin-inline-start:10px"><b style="display:block">فتح التطبيق بالبصمة أو الوجه</b><small class="sub">يطلب بصمتك أو وجهك كل ما فتحت التطبيق</small></span><i></i></button>${s.bioErr?`<div class="err">${s.bioErr}</div>`:""}</div>`;
};
window.bioToggle=async function(){
  s.bioErr="";
  const on=bioRec()&&bioRec().uid===s.user.id;
  if(on){lsSet(BIO_K,null);try{localStorage.removeItem(BIO_K)}catch(e){}draw();return}
  try{
    const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"T.K Group"},
      user:{id:new TextEncoder().encode(s.user.id).slice(0,64),name:s.user.email||"user",displayName:s.user.name||"user"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
    lsSet(BIO_K,{uid:s.user.id,id:b64(cred.rawId)});
  }catch(e){s.bioErr="ما تم التفعيل. تأكد إن البصمة أو الوجه مفعّل بالجهاز وجرّب مرة تانية."}
  draw();
};
async function bioAsk(){
  const r=bioRec();if(!r)return true;
  try{
    await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),userVerification:"required",timeout:60000,
      allowCredentials:[{type:"public-key",id:unb64(r.id)}]}});
    return true;
  }catch(e){return false}
}
function lockShow(){
  if(!bioRec()||document.getElementById("biolock"))return;
  const d=document.createElement("div");d.id="biolock";d.dir="rtl";
  d.innerHTML=`<div style="width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center">${ic("finger",44)}</div><h2 style="margin:0">T.K Group</h2><p style="margin:0;opacity:.85">افتح التطبيق بالبصمة أو الوجه</p><button class="go" id="bl-go">فتح</button><button class="lo" id="bl-out">تسجيل الخروج واستخدام كلمة المرور</button>`;
  document.body.appendChild(d);
  const go=async()=>{if(await bioAsk())d.remove()};
  d.querySelector("#bl-go").onclick=go;
  d.querySelector("#bl-out").onclick=async()=>{try{localStorage.removeItem(BIO_K)}catch(e){}d.remove();await sb.auth.signOut()};
  setTimeout(go,300);
}

/* ---- real support chat: customer <-> staff (bot stays as the first line of help) ---- */
s.ag={on:false,msgs:[],unread:0,sending:false,err:"",draft:""};
async function agLoad(){
  if(!s.user)return;
  const r=await sb.from("chat_messages").select("id,from_staff,body,at,read_by_user").order("id",{ascending:true}).limit(300);
  if(r.error)return;
  const rows=r.data||[],last=a=>a.length?a[a.length-1].id:0;
  const changed=rows.length!==s.ag.msgs.length||last(rows)!==last(s.ag.msgs);
  const unread=rows.filter(m=>m.from_staff&&!m.read_by_user).length;
  s.ag.msgs=rows;
  const inChat=s.view==="chat"&&s.ag.on;
  if(inChat&&unread){await sb.rpc("chat_mark_read");rows.forEach(m=>{if(m.from_staff)m.read_by_user=true});s.ag.unread=0}
  else{const was=s.ag.unread;s.ag.unread=unread;if(!inChat&&was!==unread&&s.view==="acct")keepDraw()}
  if(inChat&&changed){const i=$("ci"),v=i?i.value:"",f=document.activeElement===i;draw();const j=$("ci");if(j){j.value=v;if(f)j.focus()}chatEnd(0)}
}
let agTick=0;
setInterval(()=>{if(document.hidden||!s.user)return;agTick++;if((s.view==="chat"&&s.ag.on)||agTick%3===0)agLoad()},7000);
window.agStart=async function(){
  if(!s.user){s.chat.push({f:"b",t:"سجّل دخولك أولاً لتتحدث مع موظف.",d:hm()});keepDraw();chatEnd(0);return}
  s.ag.on=true;s.ag.err="";await agLoad();keepDraw();chatEnd(1);
};
window.agBack=function(){s.ag.on=false;keepDraw()};
window.agSub=async function(e){
  e.preventDefault();const i=$("ci"),v=i.value.trim();if(!v||s.ag.sending)return;
  s.ag.sending=true;s.ag.err="";s.ag.draft=v;
  const r=await sb.rpc("chat_send",{p_body:v});s.ag.sending=false;
  if(r.error){s.ag.err=/too many/.test(r.error.message)?"رسائل كثيرة، انتظر دقيقة ثم أعد المحاولة":"لم تُرسل الرسالة. حاول مرة أخرى.";keepDraw();return}
  s.ag.draft="";sfx("tap");i.value="";s.ag.msgs.push({id:1e15,from_staff:false,body:v,at:new Date().toISOString(),read_by_user:true});

};

};

/* ---- delete account (GDPR): login + personal data removed, accounting records kept anonymised ---- */
s.del={open:false,email:"",err:"",busy:false};
window.delAcctBox=function(){
