<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T.K Shipping – فحص الاتصال</title>
<style>
body{font:16px/1.6 system-ui,Arial,sans-serif;margin:0;background:#0d151c;color:#e8ecee;padding:16px}
main{max-width:520px;margin:auto}h1{font-size:20px}.box{background:#16222c;border:1px solid #2c3b47;border-radius:10px;padding:14px;margin:12px 0}
input,select,button{font:inherit;width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #2c3b47;background:#0a121a;color:#fff}
button{background:#f5c518;color:#101c26;font-weight:700;border:0;cursor:pointer}.ok{color:#5fd08f}.er{color:#ff8a7a}pre{white-space:pre-wrap;direction:ltr;text-align:left;font-size:13px}
</style></head><body><main>
<h1>T.K Shipping – فحص الاتصال بقاعدة البيانات</h1>
<div class="box"><b>1) الاتصال</b><div id="s1">…</div></div>
<div class="box"><b>2) الأسعار الحقيقية من قاعدة البيانات</b><div id="s2">…</div></div>
<div class="box"><b>3) حاسبة السعر (دالة quote_price)</b>
<select id="g"></select><input id="w" type="number" value="20" min="1" inputmode="decimal" placeholder="الوزن كغ"><button id="q">احسب</button><div id="s3"></div></div>
<div class="box"><b>4) حساب تجريبي</b>
<input id="e" type="email" placeholder="الإيميل" autocomplete="email" dir="ltr"><input id="p" type="password" placeholder="كلمة السر (8 أحرف على الأقل)" autocomplete="current-password" dir="ltr">
<button id="su">إنشاء حساب</button><button id="si">تسجيل دخول</button><button id="so" hidden>خروج</button><div id="s4"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://uvaugdqmktntmautneyp.supabase.co",SB_KEY="sb_publishable_FJgqWlepVpPPpocjYOxq1Q_sD7zGoP8";
const $=i=>document.getElementById(i),put=(i,t,c)=>{$(i).className=c||'';$(i).textContent=t};
const sb=supabase.createClient(SB_URL,SB_KEY);
const NM={newc:'جديد',used:'مستعمل',elec:'إلكترونيات',tools:'أدوات',mnew:'ماكينات جديدة',mused:'ماكينات مستعملة',fam:'عفش عائلي',oil:'زيت',mn:'مونة'};
async function init(){
  try{
    const {data,error}=await sb.from('rates').select('goods,eur_per_kg').order('goods');
    if(error)throw error;
    put('s1','الاتصال شغّال ✓','ok');
    put('s2',data.length?data.map(r=>(NM[r.goods]||r.goods)+': '+r.eur_per_kg+' €/كغ').join(' | '):'الجدول فاضي: لازم تنضاف الأسعار (الخطوة الجاية)',data.length?'ok':'er');
    $('g').innerHTML=Object.keys(NM).map(k=>'<option value="'+k+'">'+NM[k]+'</option>').join('');
  }catch(e){put('s1','فشل الاتصال: '+(e.message||e),'er')}
  sess()
}
async function sess(){const {data}=await sb.auth.getSession();const u=data.session&&data.session.user;put('s4',u?'مسجّلة الدخول: '+u.email:'غير مسجّلة','');$('so').hidden=!u}
$('q').onclick=async()=>{const {data,error}=await sb.rpc('quote_price',{p_goods:$('g').value,p_weight:+$('w').value,p_biz:false});
  error?put('s3','خطأ: '+error.message,'er'):put('s3','السعر: '+JSON.stringify(data),'ok')};
$('su').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('e').value.trim(),password:$('p').value,options:{data:{name:$('e').value.split('@')[0]}}});
  error?put('s4','خطأ: '+error.message,'er'):(put('s4','تم. إذا طلب التأكيد، افتحي الرابط اللي وصل لإيميلك ثم سجّلي دخول','ok'),sess())};
$('si').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});
  error?put('s4','خطأ: '+error.message,'er'):sess()};
$('so').onclick=async()=>{await sb.auth.signOut();sess()};
init();
</script></body></html>
